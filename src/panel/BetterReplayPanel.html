<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BetterReplay</title>
  <link rel="stylesheet" href="/SCSS/common.css" />
  <link rel="stylesheet" href="BetterReplayPanel.css" />

  <script type="text/javascript" src="/JS/coherent.js"></script>
  <script type="text/javascript" src="/JS/common.js"></script>
  <script type="text/javascript" src="/JS/dataStorage.js"></script>
  <script type="text/javascript" src="/JS/buttons.js"></script>
  <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
  <script type="text/javascript" src="/JS/Services/CommBus.js"></script>

  <link rel="import" href="/templates/ingameUi/ingameUi.html" />
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
</head>
<body class="border-box">
  <ingamepanel-betterreplay>
    <ingame-ui id="BetterReplayPanel" panel-id="PANEL_BETTERREPLAY" title="BETTERREPLAY" class="ingameUiFrame"
               content-fit="true" min-width="30" min-height="40">
      <!-- One screen at a time (.view-main / .view-clips / .view-player on the root); the control
           setup takes over the whole panel while it's offered or running (.setup-mode). -->
      <div class="br-root view-main" id="br-root">
        <!-- main: the recorder's status, the aircraft, and the way to the clips -->
        <section class="br-main" id="br-main">
          <div class="br-status">
            <div class="br-hero">
              <span class="br-dot" id="br-dot"></span>
              <strong class="br-state" id="br-state">Connecting...</strong>
              <span class="br-detail" id="br-detail"></span>
            </div>
            <div class="br-buffer">
              <div class="br-buffer-head">
                <span class="br-label">Buffer</span>
                <span class="br-buffer-time"><strong id="br-buffer">0:00</strong> <span id="br-buffer-max"></span></span>
              </div>
              <div class="br-meter"><div class="br-meter-fill" id="br-buffer-fill"></div></div>
            </div>
            <!-- says how a save went, in place: Saving..., Saved / Couldn't save, then back -->
            <button type="button" class="br-btn br-save" id="br-save">
              <span class="br-save-icon" id="br-save-icon"></span>
              <span id="br-save-label">Save last 10 minutes</span>
            </button>
          </div>
          <div class="br-error hidden" id="br-error"></div>
          <!-- a command that failed from this screen, for a few seconds (clips and the player show
               theirs in place) -->
          <div class="br-error hidden" id="br-main-note"></div>
          <div class="br-plane hidden" id="br-plane">
            <span class="br-plane-icon">
              <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="currentColor"/></svg>
            </span>
            <div class="br-plane-text">
              <span class="br-aircraft" id="br-aircraft"></span>
              <!-- whether replays can move its controls -->
              <span class="br-pill hidden" id="br-controls-pill"></span>
            </div>
            <button type="button" class="br-btn br-setup-run hidden" id="br-setup-run">Set up</button>
          </div>
          <button type="button" class="br-btn br-open-clips" id="br-open-clips">
            <svg class="br-open-icon" viewBox="0 0 24 24"><path d="M4 5h3v3H4zm5 0h11v3H9zM4 10.5h3v3H4zm5 0h11v3H9zM4 16h3v3H4zm5 0h11v3H9z" fill="currentColor"/></svg>
            <span class="br-open-label">Saved clips</span>
            <span class="br-open-count" id="br-open-count"></span>
            <svg class="br-chevron" viewBox="0 0 24 24"><path d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z" fill="currentColor"/></svg>
          </button>
        </section>

        <!-- The control setup: fills the panel while it's offered or running (.setup-mode). -->
        <section class="br-setup hidden" id="br-setup">
          <div class="br-setup-head">
            <span class="br-setup-kicker" id="br-setup-kicker"></span>
            <span class="br-setup-aircraft" id="br-setup-aircraft"></span>
          </div>
          <div class="br-steps hidden" id="br-setup-steps"></div>
          <div class="br-setup-body">
            <!-- centred in the body during the setup's steps (.stepping) -->
            <div class="br-setup-inner">
              <div class="br-phase hidden" id="br-setup-phase"></div>
              <div class="br-setup-prompt">
                <span id="br-setup-prompt"></span>
                <span class="br-tick" id="br-setup-tick"><span class="br-tick-fill" id="br-setup-tick-fill"></span></span>
              </div>
              <div class="br-setup-attempts hidden" id="br-setup-attempts"></div>
              <div class="br-setup-detail hidden" id="br-setup-detail"></div>
              <div class="br-setup-list hidden" id="br-setup-list"></div>
              <div class="br-setup-note hidden" id="br-setup-note"></div>
            </div>
          </div>
          <div class="br-setup-btns hidden" id="br-setup-btns"></div>
          <div class="br-setup-minor hidden" id="br-setup-minor"></div>
        </section>

        <!-- clips: the library -->
        <section class="br-clips" id="br-clips">
          <div class="br-clips-head">
            <button type="button" class="br-icon-btn" id="br-back" title="Back">
              <svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z" fill="currentColor"/></svg>
            </button>
            <strong>Saved clips</strong>
            <span class="br-clips-count" id="br-clips-count"></span>
          </div>
          <div class="br-clips-note hidden" id="br-clips-note"></div>
          <div class="br-list" id="br-list">
            <div class="br-empty">No clips yet. Takeoffs and landings are saved automatically.</div>
          </div>
        </section>

        <!-- player: while a clip plays; Stop brings back the main screen -->
        <section class="br-player" id="br-player">
          <span class="br-player-kicker" id="br-player-kicker">Replaying</span>
          <div class="br-now" id="br-now"></div>
          <div class="br-now-sub" id="br-now-sub"></div>
          <!-- before the replay starts (.preparing): what it's waiting for, in place of the controls -->
          <div class="br-prep">
            <div class="br-prep-spinner">
              <svg viewBox="0 0 24 24"><path d="M11 4h2v12.2l4.6-4.6 1.4 1.4-7 7-7-7 1.4-1.4 4.6 4.6z" fill="currentColor"/></svg>
            </div>
            <div class="br-prep-title">Lowering the gear</div>
            <div class="br-prep-sub">The replay starts as soon as it's down</div>
            <button type="button" class="br-btn br-prep-cancel" id="br-prep-cancel">Cancel</button>
          </div>
          <div class="br-player-body">
            <div class="br-seek" id="br-seek">
              <div class="br-seek-fill" id="br-seek-fill"></div>
              <div class="br-seek-marker" id="br-seek-marker"></div>
              <div class="br-seek-thumb" id="br-seek-thumb"></div>
            </div>
            <div class="br-times"><span id="br-time">0:00</span><span id="br-dur">0:00</span></div>
            <div class="br-transport">
              <button type="button" class="br-round br-round-main" id="br-playpause" title="Pause"></button>
              <button type="button" class="br-round br-round-stop" id="br-stop" title="Stop">
                <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
              </button>
            </div>
            <div class="br-speeds" id="br-speeds">
              <button type="button" class="br-btn" data-speed="0.25">0.25x</button>
              <button type="button" class="br-btn" data-speed="0.5">0.5x</button>
              <button type="button" class="br-btn" data-speed="1">1x</button>
              <button type="button" class="br-btn" data-speed="2">2x</button>
              <button type="button" class="br-btn" data-speed="4">4x</button>
            </div>
          </div>
        </section>
      </div>
    </ingame-ui>
  </ingamepanel-betterreplay>
  <script type="text/javascript" src="BetterReplayPanel.js"></script>
</body>
</html>
